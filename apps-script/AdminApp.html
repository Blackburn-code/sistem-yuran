<script>
(function () {
  'use strict';

  // ================= Keadaan & utiliti =================
  var BOOT = window.BOOT || {};
  var S = {
    token: null, me: null, settings: { namaSistem: BOOT.namaSistem || 'Sistem Yuran', logoUrl: BOOT.logoUrl || '' },
    page: 'dashboard', pendingCount: 0, cache: {},
    f: { pelajar: {}, tx: { tab: 'PENDING' }, matrix: {}, db: {}, log: {} }
  };
  var BULAN = ['Jan', 'Feb', 'Mac', 'Apr', 'Mei', 'Jun', 'Jul', 'Ogo', 'Sep', 'Okt', 'Nov', 'Dis'];
  var BULAN_PENUH = ['Januari', 'Februari', 'Mac', 'April', 'Mei', 'Jun', 'Julai', 'Ogos', 'September', 'Oktober', 'November', 'Disember'];
  var XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';

  function $(sel, el) { return (el || document).querySelector(sel); }
  function $$(sel, el) { return Array.prototype.slice.call((el || document).querySelectorAll(sel)); }
  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function rm(n) {
    return 'RM ' + Number(n || 0).toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function rm0(n) {
    var v = Number(n || 0);
    return 'RM ' + v.toLocaleString('en-MY', { minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 });
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function today() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function fmtDate(s) {
    if (!s) return '-';
    var p = String(s).slice(0, 10).split('-');
    if (p.length < 3) return esc(s);
    return parseInt(p[2], 10) + ' ' + BULAN[parseInt(p[1], 10) - 1] + ' ' + p[0];
  }
  function fmtDateTime(s) {
    if (!s) return '-';
    var t = String(s).slice(11, 16);
    return fmtDate(s) + (t ? ', ' + t : '');
  }
  function initials(n) {
    var parts = String(n || '').replace(/\b(bin|binti|bt|b\.)\b/gi, ' ').trim().split(/\s+/);
    return ((parts[0] || '')[0] || '').toUpperCase() + ((parts[1] || '')[0] || '').toUpperCase();
  }
  function list(csv) { return String(csv || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean); }
  function isSuper() { return S.me && S.me.peranan === 'SuperAdmin'; }
  function opts(items, selected, blank) {
    var html = blank != null ? '<option value="">' + esc(blank) + '</option>' : '';
    return html + items.map(function (it) {
      var v = typeof it === 'object' ? it.v : it;
      var l = typeof it === 'object' ? it.l : it;
      return '<option value="' + esc(v) + '"' + (String(v) === String(selected) ? ' selected' : '') + '>' + esc(l) + '</option>';
    }).join('');
  }
  var storage = {
    get: function (k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { window.localStorage.setItem(k, v); } catch (e) { } },
    del: function (k) { try { window.localStorage.removeItem(k); } catch (e) { } }
  };

  // ================= Ikon =================
  var ICONS = {
    grid: '<rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/>',
    users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    receipt: '<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M8 7h8M8 11h8M8 15h5"/>',
    table: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/>',
    tag: '<path d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
    database: '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>',
    shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    sliders: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
    logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/>',
    diamond: '<path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20"/><path d="m12 21-4-12 2-6M12 21l4-12-2-6"/>',
    crown: '<path d="m2 7 4 10h12l4-10-6 4-4-7-4 7z"/><path d="M6 21h12"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
    back: '<path d="M19 12H5M11 6l-6 6 6 6"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    x: '<path d="M18 6 6 18M6 6l12 12"/>',
    edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
    trash: '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/>',
    download: '<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',
    file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
    wallet: '<path d="M20 7H5a2 2 0 0 1 0-4h13v4"/><path d="M3 5v14a2 2 0 0 0 2 2h15V7"/><circle cx="16" cy="14" r="1.5"/>',
    alert: '<circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/>',
    menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
    eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
    link: '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
    printer: '<path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',
    refresh: '<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
    key: '<circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.3-9.3M17 6l3 3M15 8l2 2"/>',
    mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
    lock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
    trend: '<path d="m3 17 6-6 4 4 8-8"/><path d="M14 7h7v7"/>',
    hourglass: '<path d="M6 2h12M6 22h12"/><path d="M7 2v4a5 5 0 0 0 10 0V2M7 22v-4a5 5 0 0 1 10 0v4"/>'
  };
  function icon(name) { return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || '') + '</svg>'; }

  // Hiasan "sutera emas" pada kad utama
  function silk(id) {
    id = id || 'g' + Math.random().toString(36).slice(2, 7);
    var paths = '';
    for (var i = 0; i < 14; i++) {
      var o = i * 9;
      paths += '<path d="M-20 ' + (300 - o) + ' C 120 ' + (190 - o * 0.6) + ', 230 ' + (380 - o * 1.2) + ', 360 ' + (260 - o * 0.4) + ' S 560 ' + (120 + o * 0.5) + ', 640 ' + (200 - o) + '" stroke="url(#' + id + ')" stroke-width="' + (i % 4 === 0 ? 1.4 : 0.7) + '" fill="none" opacity="' + (0.9 - i * 0.05).toFixed(2) + '"/>';
    }
    return '<div class="silk"><svg viewBox="0 0 620 380" aria-hidden="true"><defs><linearGradient id="' + id + '" x1="0" x2="1" y1="0" y2="0">' +
      '<stop offset="0" stop-color="#D4AF6A" stop-opacity="0"/><stop offset=".45" stop-color="#F1DCA7" stop-opacity=".9"/><stop offset="1" stop-color="#9C7536" stop-opacity=".15"/></linearGradient></defs>' + paths + '</svg></div>';
  }
  function logoMark() {
    return '<div class="brand-mark">' + (S.settings.logoUrl ? '<img src="' + esc(S.settings.logoUrl) + '" alt="">' : icon('diamond')) + '</div>';
  }
  function twoTone(text) {
    var w = String(text || '').trim().split(/\s+/);
    if (w.length < 2) return '<span class="gold-text">' + esc(text) + '</span>';
    var last = w.pop();
    return esc(w.join(' ')) + ' <span class="gold-text">' + esc(last) + '</span>';
  }

  // ================= Panggilan pelayan =================
  function cleanErr(e) {
    var m = (e && e.message) || String(e);
    return m.replace(/^(Error|Exception|ReferenceError|TypeError):\s*/, '');
  }
  var CFG = window.SY_CONFIG || null;
  var SERVER_ERR = 'Tidak dapat berhubung dengan Google Apps Script. Pastikan Code.gs terkini, sudah Deploy "New version", dan akses "Anyone".';
  function apiReady() { return !CFG || (CFG.apiUrl && /^https:\/\/script\.google\.com\/.+\/exec$/.test(CFG.apiUrl)); }
  function run(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    if (CFG) {
      if (!apiReady()) return Promise.reject(new Error('App belum disambung ke Google Sheet. Isi apiUrl dalam fail config.js.'));
      return fetch(CFG.apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ fn: fn, args: args }),
        redirect: 'follow'
      }).then(function (r) {
        return r.json().catch(function () { throw new Error(SERVER_ERR); });
      }, function () {
        throw new Error(navigator.onLine === false ? 'Tiada sambungan internet. Cuba lagi.' : SERVER_ERR + ' (Link: …' + String(CFG.apiUrl).slice(-22) + ')');
      }).then(function (r) {
        if (!r || !r.ok) throw new Error(cleanErr({ message: (r && r.error) || 'Ralat pelayan.' }));
        return r.data;
      });
    }
    return new Promise(function (resolve, reject) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) { reject(new Error(cleanErr(e))); });
      r[fn].apply(r, args);
    });
  }
  function api(action, payload) {
    return run('apiCall', S.token, action, payload || {}).catch(function (e) {
      if (/SESI_TAMAT/.test(e.message)) {
        sessionEnded();
        throw new Error('Sesi tamat. Sila log masuk semula.');
      }
      throw e;
    });
  }
  function sessionEnded() {
    S.token = null; S.me = null; S.cache = {};
    storage.del('sy_token');
    closeAllModals();
    renderLogin('Sesi anda telah tamat. Sila log masuk semula.');
  }

  // ================= Toast, modal, busy =================
  function toast(msg, bad) {
    var el = document.createElement('div');
    el.className = 'toast' + (bad ? ' bad' : '');
    el.innerHTML = icon(bad ? 'alert' : 'check') + '<div>' + esc(msg) + '</div>';
    $('#toast-root').appendChild(el);
    setTimeout(function () { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; }, 3600);
    setTimeout(function () { el.remove(); }, 4000);
  }
  function busy(btn, fn) {
    if (!btn || btn.disabled) return Promise.resolve();
    var html = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span>' + (btn.classList.contains('btn-icon') ? '' : ' Sila tunggu');
    return Promise.resolve().then(fn).catch(function (e) { toast(e.message, true); })
      .then(function (r) { if (document.body.contains(btn)) { btn.disabled = false; btn.innerHTML = html; } return r; });
  }
  function modal(o) {
    var back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = '<div class="card modal' + (o.wide ? ' wide' : '') + '" role="dialog" aria-modal="true">' +
      '<div class="modal-head"><div>' + (o.eyebrow ? '<div class="eyebrow">' + esc(o.eyebrow) + '</div>' : '') +
      '<h3 style="margin-top:6px">' + o.title + '</h3></div><button class="btn btn-icon btn-sm" data-close aria-label="Tutup">' + icon('x') + '</button></div>' +
      '<div class="modal-body">' + (o.body || '') + '</div></div>';
    $('#modal-root').appendChild(back);
    function close() { back.remove(); document.removeEventListener('keydown', onKey); if (o.onClose) o.onClose(); }
    function onKey(e) { if (e.key === 'Escape' && back === $('#modal-root').lastElementChild) close(); }
    document.addEventListener('keydown', onKey);
    back.addEventListener('mousedown', function (e) { if (e.target === back) close(); });
    $$('[data-close]', back).forEach(function (b) { b.addEventListener('click', close); });
    var m = { el: back, body: $('.modal-body', back), close: close };
    back._close = close;
    return m;
  }
  function closeAllModals() { $$('.modal-back').forEach(function (b) { b._close ? b._close() : b.remove(); }); }
  function confirmBox(title, text, okLabel, danger) {
    return new Promise(function (resolve) {
      var done = false;
      var m = modal({
        title: esc(title),
        body: '<p class="muted" style="margin:0 0 20px">' + esc(text) + '</p><div class="modal-foot"><button class="btn" data-close>Batal</button>' +
          '<button class="btn ' + (danger ? 'btn-bad' : 'btn-gold') + '" data-ok>' + esc(okLabel || 'Teruskan') + '</button></div>',
        onClose: function () { if (!done) resolve(false); }
      });
      $('[data-ok]', m.el).addEventListener('click', function () { done = true; m.close(); resolve(true); });
    });
  }
  function promptBox(title, label, placeholder) {
    return new Promise(function (resolve) {
      var done = false;
      var m = modal({
        title: esc(title),
        body: '<div class="field"><label>' + esc(label) + '</label><input class="input" data-v placeholder="' + esc(placeholder || '') + '"></div>' +
          '<div class="modal-foot"><button class="btn" data-close>Batal</button><button class="btn btn-gold" data-ok>Hantar</button></div>',
        onClose: function () { if (!done) resolve(null); }
      });
      $('[data-v]', m.el).focus();
      $('[data-ok]', m.el).addEventListener('click', function () { done = true; var v = $('[data-v]', m.el).value; m.close(); resolve(v); });
    });
  }
  function formData(form) {
    var o = {};
    $$('[name]', form).forEach(function (el) {
      if (el.type === 'checkbox') o[el.name] = el.checked; else o[el.name] = el.value;
    });
    return o;
  }

  // ================= Komponen kecil =================
  function pageHead(eyebrow, title, desc, actions) {
    return '<div class="page-head"><div><div class="eyebrow">' + esc(eyebrow) + '</div><h1>' + title + '</h1>' +
      (desc ? '<p>' + esc(desc) + '</p>' : '') + '</div><div class="page-actions">' + (actions || '') + '</div></div>';
  }
  function txBadge(s) {
    return { VERIFIED: '<span class="badge ok">Verified</span>', PENDING: '<span class="badge warn">Pending</span>', REJECTED: '<span class="badge bad">Ditolak</span>' }[s] || '<span class="badge">' + esc(s) + '</span>';
  }
  function payBadge(s) {
    return { SUDAH: '<span class="badge ok">Sudah</span>', PENDING: '<span class="badge warn">Pending</span>', BELUM: '<span class="badge bad">Belum</span>' }[s] || '<span class="badge">-</span>';
  }
  function emptyState(title, text, ic) {
    return '<div class="empty">' + icon(ic || 'file') + '<b>' + esc(title) + '</b><div>' + esc(text || '') + '</div></div>';
  }
  function loadingBlock(h) { return '<div class="skeleton" style="height:' + (h || 220) + 'px"></div>'; }
  function kelasList() { return list(S.settings.senaraiKelas); }
  function cawList() { return list(S.settings.senaraiCawangan); }
  function tahunList() { return list(S.settings.senaraiTahun); }
  function yearOptions(sel) {
    var y0 = parseInt(S.settings.tahunMula, 10) || new Date().getFullYear();
    var y1 = new Date().getFullYear() + 1;
    var ys = [];
    for (var y = Math.min(y0, y1 - 1); y <= y1; y++) ys.push(y);
    return opts(ys, sel);
  }
  function getPelajar(force) {
    if (S.cache.pelajar && !force) return Promise.resolve(S.cache.pelajar);
    return api('pelajar.list').then(function (r) { S.cache.pelajar = r; return r; });
  }
  function invalidate() { S.cache = {}; }
  function setPending(n) {
    S.pendingCount = n;
    var el = $('#nav-pending');
    if (el) { el.textContent = n; el.classList.toggle('hidden', !n); }
  }

  // ================= Login =================
  function renderLogin(message) {
    document.title = (S.settings.namaSistem || 'Sistem Yuran') + ' · Admin';
    $('#app').innerHTML =
      '<div class="login-wrap">' +
      '<div class="card login-card">' + silk() +
      '<div style="position:relative">' + logoMark() +
      '<div class="eyebrow" style="text-align:center">Panel Pentadbir</div>' +
      '<h1 style="margin-top:12px">' + twoTone(S.settings.namaSistem || 'Sistem Yuran').replace(' <span', '<br><span') + '</h1>' +
      '<p class="tagline">Kutipan yuran yang teratur, telus dan mudah dipantau.</p>' +
      '<form id="login-form" autocomplete="on">' +
      (message ? '<div class="form-error">' + esc(message) + '</div>' : '') +
      (apiReady() ? '' : '<div class="form-error">App belum disambung ke Google Sheet. Isi <b>apiUrl</b> dalam fail config.js.</div>') +
      '<div class="field"><label for="lg-email">E-mel</label><div class="input-icon">' + icon('mail') + '<input id="lg-email" class="input" name="email" type="email" placeholder="admin@sekolah.my" autocomplete="username" required></div></div>' +
      '<div class="field"><label for="lg-pass">Kata Laluan</label><div class="input-icon">' + icon('lock') + '<input id="lg-pass" class="input" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required></div></div>' +
      '<button class="btn btn-gold" type="submit">Log Masuk ' + icon('arrow') + '</button>' +
      '</form>' +
      '<div class="small dim" style="text-align:center;margin-top:22px">© ' + new Date().getFullYear() + ' ' + esc(S.settings.namaSistem || 'Sistem Yuran') + '</div>' +
      '</div></div></div>';
    var form = $('#login-form');
    $('#lg-email').value = storage.get('sy_email') || '';
    ($('#lg-email').value ? $('#lg-pass') : $('#lg-email')).focus();
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var d = formData(form);
      var btn = $('button[type=submit]', form);
      busy(btn, function () {
        return run('apiLogin', d.email, d.password).then(function (r) {
          S.token = r.token;
          storage.set('sy_token', r.token);
          storage.set('sy_email', d.email.trim().toLowerCase());
          return startApp('dashboard');
        }).catch(function (err) {
          var old = $('.form-error', form);
          if (old) old.remove();
          form.insertAdjacentHTML('afterbegin', '<div class="form-error">' + esc(err.message) + '</div>');
          $('#lg-pass').value = '';
        });
      });
    });
  }

  function startApp(page) {
    return api('session').then(function (r) {
      S.me = r.admin;
      S.settings = r.settings;
      document.title = S.settings.namaSistem + ' · Admin';
      renderShell();
      go(page || 'dashboard');
      api('transaksi.list').then(function (tx) {
        S.cache.tx = tx;
        setPending(tx.filter(function (t) { return t.status === 'PENDING'; }).length);
      }).catch(function () { });
    });
  }

  // ================= Kerangka =================
  var NAV = [
    { id: 'dashboard', label: 'Dashboard', icon: 'grid' },
    { id: 'pelajar', label: 'Senarai Pelajar', icon: 'users' },
    { id: 'transaksi', label: 'Rekod Transaksi', icon: 'receipt', pending: true },
    { id: 'matrix', label: 'Matrix Bayaran', icon: 'table' },
    { id: 'lain', label: 'Yuran Lain-Lain', icon: 'tag' },
    { id: 'dbpelajar', label: 'Database Pelajar', icon: 'database' },
    { id: 'guru', label: 'Database Guru', icon: 'user' },
    { sep: 'Pentadbiran', sup: true },
    { id: 'admin', label: 'Urus Admin', icon: 'shield', sup: true },
    { id: 'log', label: 'Log Masuk', icon: 'clock', sup: true },
    { id: 'tetapan', label: 'Tetapan', icon: 'sliders', sup: true }
  ];

  function renderShell() {
    var nav = NAV.filter(function (n) { return !n.sup || isSuper(); }).map(function (n) {
      if (n.sep) return '<div class="nav-sep">' + esc(n.sep) + '</div>';
      return '<button class="nav-item" data-page="' + n.id + '">' + icon(n.icon) + '<span>' + esc(n.label) + '</span>' +
        (n.pending ? '<span class="count hidden" id="nav-pending">0</span>' : '') + '</button>';
    }).join('');
    var role = isSuper() ? 'Super Admin' : 'Admin' + (S.me.cawangan ? ' · ' + S.me.cawangan : '');
    $('#app').innerHTML =
      '<div class="shell" id="shell">' +
      '<aside class="sidebar">' +
      '<div class="brand">' + logoMark() + '<div><div class="brand-name">' + esc(S.settings.namaSistem) + '</div><div class="brand-role">' + esc(role) + '</div></div></div>' +
      '<nav class="nav">' + nav + '</nav>' +

  function niceMax(v) {
    if (v <= 0) return 100;
    var p = Math.pow(10, Math.floor(Math.log10(v)));
    var n = v / p;
    var m = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
    return m * p;
  }
  function barChart(data, hi) {
    var W = 720, H = 250, pl = 54, pr = 8, pt = 22, pb = 30;
    var max = niceMax(Math.max.apply(null, data.map(function (d) { return d.jumlah; })) * 1.1);
    var cw = (W - pl - pr) / data.length;
    var bw = Math.min(30, cw * 0.5);
    var y = function (v) { return pt + (H - pt - pb) * (1 - v / max); };
    var g = '';
    for (var i = 0; i <= 4; i++) {
      var v = max * i / 4;
      g += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="rgba(255,255,255,.06)" stroke-dasharray="' + (i ? '3 5' : '0') + '"/>' +
        '<text x="' + (pl - 10) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + (v >= 1000 ? (v / 1000) + 'k' : v) + '</text>';
    }
    var bars = data.map(function (d, i) {
      var x = pl + cw * i + (cw - bw) / 2;
      var top = y(d.jumlah);
      var h = Math.max(0, H - pb - top);
      var on = i === hi;
      return '<rect x="' + x + '" y="' + top + '" width="' + bw + '" height="' + h + '" rx="7" fill="url(#' + (on ? 'barHi' : 'bar') + ')"><title>' + esc(BULAN_PENUH[i]) + ': ' + rm(d.jumlah) + '</title></rect>' +
        (on && d.jumlah ? '<text x="' + (x + bw / 2) + '" y="' + (top - 8) + '" text-anchor="middle" style="fill:#F1DCA7;font-weight:600">' + rm0(d.jumlah) + '</text>' : '') +
        '<text x="' + (x + bw / 2) + '" y="' + (H - 9) + '" text-anchor="middle"' + (on ? ' style="fill:#F1DCA7"' : '') + '>' + esc(d.label) + '</text>';
    }).join('');
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Trend kutipan bulanan"><defs>' +
      '<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D4AF6A" stop-opacity=".55"/><stop offset="1" stop-color="#D4AF6A" stop-opacity=".08"/></linearGradient>' +
      '<linearGradient id="barHi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6E3B4"/><stop offset=".5" stop-color="#D4AF6A"/><stop offset="1" stop-color="#9C7536" stop-opacity=".6"/></linearGradient>' +
      '</defs>' + g + bars + '</svg>';
  }
  function ring(pct) {
    var r = 48, c = 2 * Math.PI * r;
    return '<svg class="ring" viewBox="0 0 120 120"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3DFAE"/><stop offset="1" stop-color="#A97F3E"/></linearGradient></defs>' +
      '<circle cx="60" cy="60" r="' + r + '" stroke="rgba(255,255,255,.07)" stroke-width="9" fill="none"/>' +
      '<circle cx="60" cy="60" r="' + r + '" stroke="url(#rg)" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="' + (c * pct / 100) + ' ' + c + '" transform="rotate(-90 60 60)"/>' +
      '<text x="60" y="68" text-anchor="middle" class="ring-num">' + pct + '%</text></svg>';
  }

  // ================= Rekod bayaran manual =================
  function openPayment(o) {
    var st = {
      pelajarId: o.pelajarId || '', jenis: o.jenis || 'Bulanan', tahun: o.tahun || new Date().getFullYear(),
      bulan: (o.bulan || []).slice(), yuranLainId: o.yuranLainId || '', detail: null
    };
    var m = modal({
      eyebrow: 'Bayaran tunai / manual',
      title: 'Rekod <span class="gold-text">Bayaran</span>',
      wide: true,
      body: '<div id="pay-body">' + loadingBlock(160) + '</div>'
    });
    var body = $('#pay-body', m.el);

    function loadDetail() {
      body.innerHTML = loadingBlock(200);
      return api('pelajar.detail', { id: st.pelajarId, tahun: st.tahun }).then(function (d) {
        st.detail = d;
        if (st.jenis === 'Lain' && !st.yuranLainId) {
          var first = d.lain.filter(function (l) { return l.status === 'BELUM'; })[0];
          st.yuranLainId = first ? first.id : '';
        }
        draw();
      }).catch(function (e) { body.innerHTML = '<div class="form-error">' + esc(e.message) + '</div>'; });
    }

    function drawPicker() {
      getPelajar().then(function (rows) {
        body.innerHTML = '<div class="field"><label>Cari pelajar</label><div class="input-icon">' + icon('search') + '<input class="input" id="pay-q" placeholder="Nama atau No. IC" autocomplete="off"></div><div class="suggest" id="pay-sug"></div></div>';
        var q = $('#pay-q', body), sug = $('#pay-sug', body);
        function list2() {
          var v = q.value.toLowerCase();
          var out = rows.filter(function (p) { return p.status !== 'Berhenti' && (!v || (p.nama + ' ' + p.ic).toLowerCase().indexOf(v) >= 0); }).slice(0, 40);
          sug.innerHTML = out.map(function (p) {
            return '<button type="button" data-id="' + esc(p.id) + '"><b>' + esc(p.nama) + '</b><span>' + esc(p.ic) + ' · ' + esc(p.kelas) + '</span></button>';
          }).join('') || '<div class="muted small" style="padding:12px">Tiada padanan.</div>';
          $$('button', sug).forEach(function (b) {
            b.addEventListener('click', function () { st.pelajarId = b.getAttribute('data-id'); st.bulan = []; loadDetail(); });
          });
        }
        q.addEventListener('input', list2);
        list2();
        q.focus();
      });
    }

    function draw() {
      var d = st.detail, p = d.pelajar;
      var yuran = Number(S.settings.yuranBulanan) || 0;
      var lainOpen = d.lain.filter(function (l) { return l.status === 'BELUM'; });
      var html = '<div class="chosen"><div class="avatar">' + esc(initials(p.nama)) + '</div><div style="flex:1;min-width:0"><b>' + esc(p.nama) + '</b><div class="small muted">' + esc(p.ic) + ' · ' + esc(p.kelas) + ' · ' + esc(p.cawangan) + '</div></div>' +
        (o.pelajarId ? '' : '<button class="link small" id="pay-change">Tukar</button>') + '</div>' +
        '<div style="margin:18px 0 14px"><div class="tabs"><button class="tab' + (st.jenis === 'Bulanan' ? ' active' : '') + '" data-j="Bulanan">Yuran Bulanan</button><button class="tab' + (st.jenis === 'Lain' ? ' active' : '') + '" data-j="Lain">Yuran Lain-Lain</button></div></div>';
      if (st.jenis === 'Bulanan') {
        html += '<div class="field"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><span class="label">Pilih bulan (boleh lebih dari satu)</span>' +
          '<select class="input" id="pay-year" style="width:100px;height:34px">' + yearOptions(st.tahun) + '</select></div>' +
          '<div class="month-pick">' + d.bulan.map(function (b) {
            var on = st.bulan.indexOf(b.key) >= 0;
            var lbl = { SUDAH: 'Sudah', PENDING: 'Pending', BELUM: 'Belum', AKAN: 'Akan', TIADA: '—' }[b.status];
            return '<button type="button" class="' + b.status + (on ? ' on' : '') + '" data-k="' + b.key + '"' + (b.status === 'SUDAH' || b.status === 'PENDING' ? ' disabled' : '') + '>' + b.label + '<small>' + lbl + '</small></button>';
          }).join('') + '</div></div>' +
          '<div class="grid-2"><div class="field"><label>Jumlah sebulan (RM)</label><input class="input" id="pay-amt" type="number" min="1" step="0.01" value="' + yuran + '"></div>';
      } else {
        if (!lainOpen.length) {
          body.innerHTML = html + emptyState('Tiada yuran lain tertunggak', 'Pelajar ini tiada caj tambahan yang belum dibayar.', 'tag') +
            '<div class="modal-foot"><button class="btn" data-close2>Tutup</button></div>';
          bindCommon();
          return;
        }
        html += '<div class="grid-2"><div class="field"><label>Yuran</label><select class="input" id="pay-lain">' + opts(lainOpen.map(function (l) { return { v: l.id, l: l.nama + ' (' + rm0(l.jumlah) + ')' }; }), st.yuranLainId) + '</select></div>' +
          '<div class="field"><label>Jumlah (RM)</label><input class="input" id="pay-amt" type="number" min="1" step="0.01" value="' + ((lainOpen.filter(function (l) { return l.id === st.yuranLainId; })[0] || lainOpen[0]).jumlah) + '"></div>';
      }
      html += '<div class="field"><label>Kaedah bayaran</label><select class="input" id="pay-kaedah">' + opts(['Tunai', 'Pindahan Bank', 'QR / DuitNow', 'Lain-lain'], 'Tunai') + '</select></div>' +
        '<div class="field"><label>Tarikh bayaran</label><input class="input" id="pay-date" type="date" value="' + today() + '"></div>' +
        '<div class="field" style="grid-column:1/-1"><label>Catatan (pilihan)</label><input class="input" id="pay-note" placeholder="cth: Dibayar di kaunter"></div></div>' +
        '<div class="total-line"><span class="muted">Jumlah diterima</span><b class="gold-text" id="pay-total">RM 0.00</b></div>' +
        '<div class="modal-foot"><button class="btn" data-close2>Batal</button><button class="btn btn-gold" id="pay-save">' + icon('check') + ' Sahkan & Jana Resit</button></div>';
      body.innerHTML = html;

      function total() {
        var amt = Number(($('#pay-amt', body) || {}).value) || 0;
        var n = st.jenis === 'Bulanan' ? st.bulan.length : (st.yuranLainId ? 1 : 0);
        $('#pay-total', body).textContent = rm(amt * n);
      }
      function bindCommon() {
        var ch = $('#pay-change', body);
        if (ch) ch.addEventListener('click', function () { st.pelajarId = ''; drawPicker(); });
        $('[data-close2]', body).addEventListener('click', m.close);
        $$('[data-j]', body).forEach(function (b) {
          b.addEventListener('click', function () {
            st.jenis = b.getAttribute('data-j');
            if (st.jenis === 'Lain' && !st.yuranLainId && lainOpen[0]) st.yuranLainId = lainOpen[0].id;
            draw();
          });
        });
      }
      bindCommon();
      $$('.month-pick button', body).forEach(function (b) {
        b.addEventListener('click', function () {
          var k = b.getAttribute('data-k');
          var i = st.bulan.indexOf(k);
          if (i >= 0) st.bulan.splice(i, 1); else st.bulan.push(k);
          b.classList.toggle('on', i < 0);
          total();
        });
      });
      var yr = $('#pay-year', body);
      if (yr) yr.addEventListener('change', function () { st.tahun = yr.value; loadDetail(); });
      var ls = $('#pay-lain', body);
      if (ls) ls.addEventListener('change', function () {
        st.yuranLainId = ls.value;
        $('#pay-amt', body).value = lainOpen.filter(function (l) { return l.id === ls.value; })[0].jumlah;
        total();
      });
      $('#pay-amt', body).addEventListener('input', total);
      total();

      $('#pay-save', body).addEventListener('click', function () {
        var btn = this;
        busy(btn, function () {
          return api('transaksi.add', {
            pelajarId: st.pelajarId, jenis: st.jenis, bulan: st.bulan.slice().sort(), yuranLainId: st.yuranLainId,
            jumlah: $('#pay-amt', body).value, kaedah: $('#pay-kaedah', body).value, tarikh: $('#pay-date', body).value,
            catatan: $('#pay-note', body).value
          }).then(function (res) {
            invalidate();
            m.close();
            toast(res.length + ' bayaran direkod · Resit ' + res.map(function (t) { return t.noResit; }).join(', '));
            refresh();
            if (res.length) openReceipt(res[0].id, res);
          });
        });
      });
    }

    if (st.pelajarId) loadDetail(); else drawPicker();
  }

  // ================= Cetak & eksport =================
  function printHtml(html, landscape) {
    var area = $('#print-area');
    area.innerHTML = (landscape ? '<style>@page { size: A4 landscape; }</style>' : '') + html;
    setTimeout(function () { window.print(); }, 60);
  }
  function printTable(title, sub, headers, rows, landscape) {
    printHtml('<h1>' + esc(title) + '</h1><div class="p-sub">' + esc(sub) + ' · Dicetak ' + fmtDateTime(new Date().toISOString().replace('T', ' ')) + '</div>' +
      '<table><thead><tr>' + headers.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>', landscape);
  }
  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      if (window.XLSX) return resolve();
      var s = document.createElement('script');
      s.src = src; s.onload = resolve; s.onerror = function () { reject(new Error('Gagal muat turun pustaka Excel')); };
      document.head.appendChild(s);
    });
  }
  function exportExcel(filename, sheetName, headers, rows) {
    return loadScript(XLSX_URL).then(function () {
      var ws = window.XLSX.utils.aoa_to_sheet([headers].concat(rows));
      ws['!cols'] = headers.map(function (h, i) {
        var w = Math.max(String(h).length, rows.reduce(function (a, r) { return Math.max(a, String(r[i] == null ? '' : r[i]).length); }, 0));
        return { wch: Math.min(48, w + 2) };
      });
      var wb = window.XLSX.utils.book_new();
      window.XLSX.utils.book_append_sheet(wb, ws, sheetName.slice(0, 30));
      window.XLSX.writeFile(wb, filename + '.xlsx');
    }).catch(function () {
      // Sandaran: CSV (boleh dibuka dalam Excel)
      var csv = [headers].concat(rows).map(function (r) {
        return r.map(function (c) { var v = String(c == null ? '' : c); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',');
      }).join('\n');
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
      a.download = filename + '.csv';
      document.body.appendChild(a); a.click(); a.remove();
    });
  }

  // ================= Rekod Transaksi =================
  PAGES.transaksi = function (main) {
    var f = S.f.tx;
    return api('transaksi.list').then(function (rows) {
      S.cache.tx = rows;
      var counts = { ALL: rows.length, PENDING: 0, VERIFIED: 0, REJECTED: 0 };
      rows.forEach(function (t) { counts[t.status] = (counts[t.status] || 0) + 1; });
      setPending(counts.PENDING);
      if (f.tab === 'PENDING' && !counts.PENDING && !f.touched) f.tab = 'ALL';
      main.innerHTML = pageHead('Kewangan', twoTone('Rekod Transaksi'), 'Semak bukti bayaran ibu bapa dan sahkan. Resit rasmi dijana automatik selepas disahkan.',
        '<button class="btn btn-ghost" id="tx-xls">' + icon('download') + ' Excel</button><button class="btn btn-gold" id="tx-add">' + icon('plus') + ' Bayaran Manual</button>') +
        '<div class="toolbar"><div class="tabs" id="tx-tabs">' +
        [['ALL', 'Semua'], ['PENDING', 'Pending'], ['VERIFIED', 'Verified'], ['REJECTED', 'Ditolak']].map(function (t) {
          return '<button class="tab' + (f.tab === t[0] ? ' active' : '') + '" data-t="' + t[0] + '">' + t[1] + ' <span class="n">' + (counts[t[0]] || 0) + '</span></button>';
        }).join('') + '</div>' +
        '<div class="input-icon">' + icon('search') + '<input class="input" id="tx-q" placeholder="Cari nama, IC atau no. resit" value="' + esc(f.q || '') + '"></div>' +
        '<select class="input" id="tx-jenis">' + opts([{ v: 'Bulanan', l: 'Yuran bulanan' }, { v: 'Lain', l: 'Yuran lain-lain' }], f.jenis, 'Semua jenis') + '</select>' +
        '</div><div class="card" style="padding:0"><div class="table-wrap" style="border:0" id="tx-table"></div></div>';

      function filtered() {
        var q = (f.q || '').toLowerCase();
        return rows.filter(function (t) {
          if (f.tab !== 'ALL' && t.status !== f.tab) return false;
          if (f.jenis && t.jenis !== f.jenis) return false;
          if (q && (t.namaPelajar + ' ' + t.ic + ' ' + t.noResit + ' ' + t.perkaraLabel).toLowerCase().indexOf(q) < 0) return false;
          return true;
        });
      }
      function draw() {
        var out = filtered();
        $('#tx-table').innerHTML = out.length ? '<table class="tbl"><thead><tr><th>Tarikh</th><th>Pelajar</th><th>Perkara</th><th class="num">Jumlah</th><th>Kaedah</th><th>Status</th><th>Bukti</th><th></th></tr></thead><tbody>' +
          out.slice(0, 400).map(function (t) {
            var act = t.status === 'PENDING'
              ? '<button class="btn btn-sm btn-ok" data-v="' + esc(t.id) + '">' + icon('check') + ' Sahkan</button><button class="btn btn-sm btn-icon btn-bad" data-x="' + esc(t.id) + '" title="Tolak">' + icon('x') + '</button>'
              : t.status === 'VERIFIED' ? '<button class="btn btn-sm btn-ghost" data-r="' + esc(t.id) + '">' + icon('receipt') + ' Resit</button>' : '<span class="small dim">' + esc(t.catatan || '') + '</span>';
            if (isSuper() && t.status !== 'PENDING') act += '<button class="btn btn-sm btn-icon" data-d="' + esc(t.id) + '" title="Padam">' + icon('trash') + '</button>';
            return '<tr><td class="nowrap">' + fmtDate(t.tarikh) + '<div class="small dim">' + esc(t.noResit || '') + '</div></td>' +
              '<td class="who"><b>' + esc(t.namaPelajar) + '</b><span>' + esc(t.ic) + ' · ' + esc(t.kelas) + '</span></td>' +
              '<td>' + esc(t.perkaraLabel) + '<div class="small dim">' + (t.jenis === 'Bulanan' ? 'Yuran bulanan' : 'Yuran lain-lain') + '</div></td>' +
              '<td class="num"><span class="amt" style="font-size:17px">' + rm0(t.jumlah) + '</span></td>' +
              '<td class="nowrap">' + esc(t.kaedah) + '</td><td>' + txBadge(t.status) + '</td>' +
              '<td>' + (t.buktiUrl ? '<a class="btn btn-sm btn-icon" href="' + esc(t.buktiUrl) + '" target="_blank" rel="noopener" title="Lihat bukti">' + icon('eye') + '</a>' : '<span class="dim">—</span>') + '</td>' +
              '<td><div class="row-actions">' + act + '</div></td></tr>';
          }).join('') + '</tbody></table>' + (out.length > 400 ? '<div class="small muted" style="padding:12px 14px">Memaparkan 400 rekod pertama. Gunakan carian untuk tapis.</div>' : '')
          : emptyState(f.tab === 'PENDING' ? 'Tiada bayaran menunggu' : 'Tiada transaksi', f.tab === 'PENDING' ? 'Semua bukti bayaran telah disemak.' : 'Cuba ubah penapis.', 'receipt');

        $$('[data-v]', main).forEach(function (b) {
          b.addEventListener('click', function () {
            busy(b, function () {
              return api('transaksi.verify', { id: b.getAttribute('data-v') }).then(function (t) {
                toast('Bayaran disahkan · Resit ' + t.noResit);
                invalidate(); refresh();
              });
            });
          });
        });
        $$('[data-x]', main).forEach(function (b) {
          b.addEventListener('click', function () {
            promptBox('Tolak bayaran', 'Sebab penolakan (akan dilihat oleh ibu bapa)', 'cth: Resit tidak jelas').then(function (sebab) {
              if (sebab == null) return;
              busy(b, function () {
                return api('transaksi.reject', { id: b.getAttribute('data-x'), sebab: sebab }).then(function () { toast('Bayaran ditolak.'); invalidate(); refresh(); });
              });
            });

        '<div class="card" style="padding:0"><div class="table-wrap" style="border:0" id="mx-table"></div></div>';

      function filtered() {
        var q = (f.q || '').toLowerCase();

          if (f.caw && r.cawangan !== f.caw) return false;
          if (f.kelas && r.kelas !== f.kelas) return false;
          if (q && (r.nama + ' ' + r.ic).toLowerCase().indexOf(q) < 0) return false;
          return true;
        });
      }
      function draw() {
        var rows = filtered();
        var paidCol = BULAN.map(function () { return 0; });

        return filtered().map(function (r) {
          return [r.nama, r.ic, r.kelas, r.cawangan].concat(r.bulan.map(function (s) { return { SUDAH: 'Sudah', PENDING: 'Pending', BELUM: 'Belum', AKAN: '', TIADA: '-' }[s]; }));
        });

      $('#mx-q').addEventListener('input', function () { f.q = this.value; draw(); });

        var b = this;
        busy(b, function () { return exportExcel('Matrix-Bayaran-' + d.tahun, 'Matrix ' + d.tahun, ['Nama', 'No. IC', 'Kelas', 'Cawangan'].concat(BULAN), exportRows()); });
      });
      $('#mx-pdf').addEventListener('click', function () {
        printTable('Matrix Bayaran ' + d.tahun, S.settings.namaSekolah + (f.caw ? ' · ' + f.caw : '') + (f.kelas ? ' · ' + f.kelas : ''), ['Nama', 'No. IC', 'Kelas', 'Cawangan'].concat(BULAN), exportRows(), true);
      });
      draw();

        var locked = !!S.me.cawangan;
        var m = modal({
          eyebrow: g.id ? 'Kemas kini' : 'Pendaftaran', title: g.id ? 'Edit Guru' : 'Tambah <span class="gold-text">Guru</span>', wide: true,
          body: '<form id="gf"><div class="grid-2">' +
            '<div class="field" style="grid-column:1/-1"><label>Nama penuh *</label><input class="input" name="nama" required value="' + esc(g.nama) + '"></div>' +
            '<div class="field"><label>No. IC</label><input class="input" name="ic" value="' + esc(g.ic) + '"></div>' +
            '<div class="field"><label>Jawatan</label><input class="input" name="jawatan" placeholder="Guru Kelas" value="' + esc(g.jawatan) + '"></div>' +
            '<div class="field"><label>Kelas</label><select class="input" name="kelas">' + opts(kelasList(), g.kelas, '-') + '</select></div>' +
            '<div class="field"><label>Cawangan</label><select class="input" name="cawangan"' + (locked ? ' disabled' : '') + '>' + opts(cawList(), locked ? S.me.cawangan : g.cawangan, '-') + '</select></div>' +
            '<div class="field"><label>No. telefon</label><input class="input" name="tel" value="' + esc(g.tel) + '"></div>' +
            '<div class="field"><label>E-mel</label><input class="input" type="email" name="email" value="' + esc(g.email) + '"></div>' +
            '<div class="field"><label>Status</label><select class="input" name="status">' + opts(['Aktif', 'Tidak Aktif'], g.status || 'Aktif') + '</select></div>' +
            '</div><div class="modal-foot"><button type="button" class="btn" data-close>Batal</button><button class="btn btn-gold" type="submit">' + icon('check') + ' Simpan</button></div></form>'
        });
        $('#gf', m.el).addEventListener('submit', function (e) {
          e.preventDefault();
          var d = formData(this);
          if (g.id) d.id = g.id;
          busy($('button[type=submit]', this), function () { return api('guru.save', d).then(function () { toast('Maklumat guru disimpan.'); m.close(); refresh(); }); });
        });
      }
      $('#g-add').addEventListener('click', function () { form(null); });
      $$('[data-e]', main).forEach(function (b) { b.addEventListener('click', function () { form(rows.filter(function (g) { return g.id === b.getAttribute('data-e'); })[0]); }); });
      $$('[data-d]', main).forEach(function (b) {
        b.addEventListener('click', function () {
          confirmBox('Padam guru?', 'Rekod guru ini akan dibuang.', 'Padam', true).then(function (ok) {
            if (ok) busy(b, function () { return api('guru.delete', { id: b.getAttribute('data-d') }).then(function () { toast('Guru dipadam.'); refresh(); }); });
          });
        });
      });
      $('#g-xls').addEventListener('click', function () {
        var b = this;
        busy(b, function () { return exportExcel('Database-Guru-' + today(), 'Guru', ['Nama', 'No. IC', 'Jawatan', 'Kelas', 'Cawangan', 'Telefon', 'E-mel', 'Status'], rows.map(function (g) { return [g.nama, g.ic, g.jawatan, g.kelas, g.cawangan, g.tel, g.email, g.status]; })); });
      });
    });
  };

  // ================= Urus Admin =================
  PAGES.admin = function (main) {
    return api('admin.list').then(function (rows) {
      var editing = null;
      main.innerHTML = pageHead('Akses sistem', twoTone('Urus Admin'), 'Tambah admin baharu dan hadkan setiap admin kepada cawangan masing-masing.') +
        '<div class="two-col"><div class="card" id="ad-form"></div><div class="card" style="padding:0"><div class="table-wrap" style="border:0" id="ad-table"></div></div></div>';
      function drawForm() {
        var a = editing || {};
        $('#ad-form').innerHTML = '<div class="card-head"><div><div class="card-title">' + (editing ? 'Edit Admin' : 'Tambah Admin Baharu') + '</div><div class="card-sub">' + (editing ? esc(a.email) : 'Admin boleh log masuk dengan e-mel ini') + '</div></div></div>' +
          '<form id="adf"><div class="field"><label>E-mel log masuk *</label><input class="input" type="email" name="email" required value="' + esc(a.email) + '"></div>' +
          '<div class="field"><label>Nama</label><input class="input" name="nama" value="' + esc(a.nama) + '"></div>' +
          '<div class="field"><label>Kata laluan' + (editing ? '' : ' *') + '</label><input class="input" type="password" name="password" autocomplete="new-password" placeholder="' + (editing ? 'Biarkan kosong jika tidak tukar' : 'Minimum 8 aksara') + '"' + (editing ? '' : ' required minlength="8"') + '></div>' +
          '<div class="field"><label>Peranan</label><select class="input" name="peranan">' + opts([{ v: 'Admin', l: 'Admin' }, { v: 'SuperAdmin', l: 'Super Admin (akses penuh)' }], a.peranan || 'Admin') + '</select></div>' +
          '<div class="field"><label>Cawangan</label><select class="input" name="cawangan">' + opts(cawList(), a.cawangan, 'Semua cawangan') + '</select></div>' +
          (editing ? '<div class="field"><label>Status</label><select class="input" name="status">' + opts(['Aktif', 'Tidak Aktif'], a.status) + '</select></div>' : '') +
          '<div class="small muted" style="margin-bottom:14px">Admin yang dihadkan kepada satu cawangan hanya nampak pelajar, guru dan transaksi cawangan tersebut.</div>' +
          '<div style="display:flex;gap:10px">' + (editing ? '<button type="button" class="btn" id="adf-cancel">Batal</button>' : '') + '<button class="btn btn-gold" type="submit" style="flex:1">' + icon('check') + ' Simpan</button></div></form>';
        var c = $('#adf-cancel');
        if (c) c.addEventListener('click', function () { editing = null; drawForm(); });
        $('#adf').addEventListener('submit', function (e) {
          e.preventDefault();
          var d = formData(this);
          if (editing) d.id = editing.id;
          busy($('button[type=submit]', this), function () { return api('admin.save', d).then(function () { toast('Akaun admin disimpan.'); refresh(); }); });
        });
      }
      $('#ad-table').innerHTML = '<table class="tbl"><thead><tr><th>Admin</th><th>Peranan</th><th>Cawangan</th><th>Status</th><th>Log masuk terakhir</th><th></th></tr></thead><tbody>' +
        rows.map(function (a) {
          return '<tr><td class="who"><b>' + esc(a.nama || '-') + (a.id === S.me.id ? ' <span class="badge gold no-dot">Anda</span>' : '') + '</b><span>' + esc(a.email) + '</span></td>' +
            '<td>' + (a.peranan === 'SuperAdmin' ? '<span class="badge gold">Super Admin</span>' : '<span class="badge info">Admin</span>') + '</td>' +
            '<td class="nowrap">' + esc(a.cawangan || 'Semua') + '</td><td>' + (a.status === 'Aktif' ? '<span class="badge ok">Aktif</span>' : '<span class="badge bad">Tidak aktif</span>') + '</td>' +
            '<td class="nowrap small">' + fmtDateTime(a.logMasukTerakhir) + '</td>' +
            '<td><div class="row-actions"><button class="btn btn-sm btn-icon" data-e="' + esc(a.id) + '">' + icon('edit') + '</button>' + (a.id === S.me.id ? '' : '<button class="btn btn-sm btn-icon" data-d="' + esc(a.id) + '">' + icon('trash') + '</button>') + '</div></td></tr>';
        }).join('') + '</tbody></table>';
      $$('[data-e]', main).forEach(function (b) {
        b.addEventListener('click', function () { editing = rows.filter(function (a) { return a.id === b.getAttribute('data-e'); })[0]; drawForm(); $('#ad-form').scrollIntoView({ behavior: 'smooth' }); });
      });
      $$('[data-d]', main).forEach(function (b) {
        b.addEventListener('click', function () {
          confirmBox('Padam admin?', 'Admin ini tidak lagi boleh log masuk.', 'Padam', true).then(function (ok) {
            if (ok) busy(b, function () { return api('admin.delete', { id: b.getAttribute('data-d') }).then(function () { toast('Admin dipadam.'); refresh(); }); });
          });
        });
      });
      drawForm();
    });
  };

  // ================= Log Masuk =================
  PAGES.log = function (main) {
    var f = S.f.log;
    return api('log.list').then(function (rows) {
      main.innerHTML = pageHead('Audit keselamatan', twoTone('Log Masuk'), 'Rekod siapa log masuk, bila, dan cubaan yang gagal.',
        '<button class="btn btn-ghost" id="lg-ref">' + icon('refresh') + ' Muat semula</button>') +
        '<div class="toolbar"><div class="input-icon">' + icon('search') + '<input class="input" id="lg-q" placeholder="Cari e-mel" value="' + esc(f.q || '') + '"></div>' +
        '<select class="input" id="lg-s">' + opts(['Berjaya', 'Gagal'], f.s, 'Semua status') + '</select></div>' +
        '<div class="card" style="padding:0"><div class="table-wrap" style="border:0" id="lg-table"></div></div>';
      function draw() {
        var q = (f.q || '').toLowerCase();
        var out = rows.filter(function (l) { return (!q || l.email.indexOf(q) >= 0) && (!f.s || l.status === f.s); });
        $('#lg-table').innerHTML = out.length ? '<table class="tbl"><thead><tr><th>Masa</th><th>E-mel</th><th>Status</th><th>Peranan</th><th>Cawangan</th><th>Catatan</th></tr></thead><tbody>' +
          out.map(function (l) {
            return '<tr><td class="nowrap">' + fmtDateTime(l.masa) + '</td><td>' + esc(l.email) + '</td><td>' + (l.status === 'Berjaya' ? '<span class="badge ok">Berjaya</span>' : '<span class="badge bad">Gagal</span>') + '</td>' +
              '<td>' + esc(l.peranan === 'SuperAdmin' ? 'Super Admin' : (l.peranan || '-')) + '</td><td>' + esc(l.cawangan || '-') + '</td><td class="muted">' + esc(l.catatan || '') + '</td></tr>';
          }).join('') + '</tbody></table>' : emptyState('Tiada rekod', '', 'clock');
      }
      $('#lg-q').addEventListener('input', function () { f.q = this.value.toLowerCase(); draw(); });
      $('#lg-s').addEventListener('change', function () { f.s = this.value; draw(); });
      $('#lg-ref').addEventListener('click', refresh);
      draw();
    });
  };

  // ================= Tetapan =================
  PAGES.tetapan = function (main) {
    return api('tetapan.get').then(function (s) {
      var bulan = list(s.bulanDikenakan).map(Number);
      function field(k, label, type, hint) {
        return '<div class="field"><label>' + esc(label) + '</label>' + (type === 'area'
          ? '<textarea class="input" name="' + k + '" rows="2">' + esc(s[k]) + '</textarea>'
          : '<input class="input" name="' + k + '" type="' + (type || 'text') + '" value="' + esc(s[k]) + '"' + (type === 'number' ? ' min="1" step="0.01"' : '') + '>') +
          (hint ? '<div class="small dim">' + esc(hint) + '</div>' : '') + '</div>';
      }
      function section(id, title, sub, inner) {
        return '<form class="card" data-sec="' + id + '"><div class="card-head"><div><div class="card-title">' + title + '</div><div class="card-sub">' + esc(sub) + '</div></div></div>' + inner +
          '<div style="display:flex;justify-content:flex-end"><button class="btn btn-gold" type="submit">' + icon('check') + ' Simpan</button></div></form>';
      }
      main.innerHTML = pageHead('Konfigurasi', twoTone('Tetapan Sistem'), 'Kawal kadar yuran, bil bulanan, maklumat bank dan nama sekolah.') +
        '<div class="settings-grid">' +
        section('yuran', 'Yuran & Bil Bulanan', 'Bil dijana automatik pada 1hb setiap bulan',
          '<div class="grid-2">' + field('yuranBulanan', 'Yuran bulanan (RM)', 'number') + field('tahunMula', 'Tahun mula kiraan hutang', 'number') + '</div>' +
          '<div class="field"><label>Bulan yang dikenakan yuran</label><div class="month-toggles">' + BULAN.map(function (b, i) {
            return '<button type="button" class="' + (bulan.indexOf(i + 1) >= 0 ? 'on' : '') + '" data-m="' + (i + 1) + '">' + b + '</button>';
          }).join('') + '</div><div class="small dim" style="margin-top:6px">Matikan bulan cuti (contoh Disember) supaya tidak dikira sebagai hutang.</div></div>') +
        section('sekolah', 'Maklumat Sekolah', 'Dipaparkan pada resit rasmi',
          field('namaSistem', 'Nama sistem') + field('namaSekolah', 'Nama sekolah / institusi') + field('alamatSekolah', 'Alamat', 'area') +
          '<div class="grid-2">' + field('telSekolah', 'No. telefon') + field('logoUrl', 'URL logo (pilihan)', 'url') + '</div>') +
        section('bank', 'Maklumat Bank', 'Dipaparkan kepada ibu bapa semasa membuat bayaran',
          field('namaBank', 'Nama bank') + field('namaAkaun', 'Nama pemegang akaun') + field('noAkaun', 'No. akaun')) +
        section('senarai', 'Kelas, Tahun & Cawangan', 'Asingkan setiap pilihan dengan koma',
          field('senaraiKelas', 'Senarai kelas', 'area', 'cth: Kelas A, Kelas B') + field('senaraiTahun', 'Senarai tahun / umur', 'area') + field('senaraiCawangan', 'Senarai cawangan', 'area')) +
        '</div>';
      $$('.month-toggles button', main).forEach(function (b) { b.addEventListener('click', function () { b.classList.toggle('on'); }); });
      $$('form[data-sec]', main).forEach(function (form) {
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          var d = formData(form);
          var tg = $$('.month-toggles button', form);
          if (tg.length) d.bulanDikenakan = tg.filter(function (b) { return b.classList.contains('on'); }).map(function (b) { return b.getAttribute('data-m'); }).join(',');
          busy($('button[type=submit]', form), function () {
            return api('tetapan.save', d).then(function (ns) {
              S.settings = ns;
              invalidate();
              toast('Tetapan disimpan.');
              if ('namaSistem' in d || 'logoUrl' in d) { renderShell(); go('tetapan'); }
            });
          });
        });
      });
    });
  };

  // ================= Akaun saya =================
  function openAccount() {
    var m = modal({
      eyebrow: S.me.email, title: 'Akaun <span class="gold-text">Saya</span>',
      body: '<form id="acc"><div class="field"><label>Kata laluan semasa</label><input class="input" type="password" name="lama" autocomplete="current-password" required></div>' +
        '<div class="field"><label>Kata laluan baharu</label><input class="input" type="password" name="baru" autocomplete="new-password" minlength="8" required></div>' +
        '<div class="field"><label>Ulang kata laluan baharu</label><input class="input" type="password" name="ulang" autocomplete="new-password" minlength="8" required></div>' +
        '<div class="modal-foot"><button type="button" class="btn" data-close>Batal</button><button class="btn btn-gold" type="submit">' + icon('key') + ' Tukar Kata Laluan</button></div></form>'
    });
    $('#acc', m.el).addEventListener('submit', function (e) {
      e.preventDefault();
      var d = formData(this);
      if (d.baru !== d.ulang) { toast('Kata laluan baharu tidak sepadan.', true); return; }
      busy($('button[type=submit]', this), function () {
        return api('akaun.password', d).then(function () {
          S.me.lalai = false;
          toast('Kata laluan berjaya ditukar.');
          m.close();
          if (S.page === 'dashboard') refresh();
        });
      });
    });
  }

  // ================= Mula =================
  function loadInfo() {
    if (!CFG) return;
    try {
      var cached = JSON.parse(storage.get('sy_info') || 'null');
      if (cached) { S.settings.namaSistem = cached.namaSistem || S.settings.namaSistem; S.settings.logoUrl = cached.logoUrl || ''; }
    } catch (e) { }
    if (!apiReady()) return;
    run('apiInfo').then(function (info) {
      var changed = info.namaSistem !== S.settings.namaSistem || (info.logoUrl || '') !== (S.settings.logoUrl || '');
      storage.set('sy_info', JSON.stringify(info));
      if (changed && !S.token) { S.settings.namaSistem = info.namaSistem; S.settings.logoUrl = info.logoUrl; renderLogin(); }
    }).catch(function () { });
  }
  function boot() {
    loadInfo();
    S.token = storage.get('sy_token');
    if (!S.token) return renderLogin();
    startApp(storage.get('sy_page') || 'dashboard').catch(function () {
      S.token = null;
      storage.del('sy_token');
      renderLogin();
    });
  }
  boot();
})();
</script>
